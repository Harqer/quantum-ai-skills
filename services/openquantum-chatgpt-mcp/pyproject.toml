[project]
name = "openquantum-chatgpt-mcp"
version = "0.1.0"
description = "Private Streamable HTTP MCP bridge from ChatGPT to the official Open Quantum SDK"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.0.0,<3.0.0",
  "openquantum-sdk",
  "uvicorn>=0.35,<1",
]

[tool.vercel]
entrypoint = "app:app"
